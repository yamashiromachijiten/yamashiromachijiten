backend:
  name: git-gateway
  branch: main

local_backend: true
locale: "ja"

# Decap CMS requires a media folder in config even when this project has no image fields.
media_folder: "site/static/media"
public_folder: "/media"

collections:
  - name: "home"
    label: "ホーム"
    files:
      - file: "site/content/_index.md"
        label: "ホーム"
        name: "home"
        fields:
          - { label: "タイトル", name: "title", widget: "string" }
          - { label: "説明", name: "description", widget: "text" }

  - name: "categories"
    label: "カテゴリ"
    folder: "site/content/term-categories"
    path: "{{slug}}"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "カテゴリ名", name: "title", widget: "string" }
      - { label: "よみがな", name: "kana", widget: "string" }

  - name: "terms"
    label: "用語"
    folder: "site/content/terms"
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "用語", name: "title", widget: "string" }
      - { label: "よみがな", name: "kana", widget: "string" }
      - label: "カテゴリ"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title", "kana"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        required: false
        default: ["uncategorized"]
      - { label: "意味の解説文", name: "body", widget: "markdown" }
