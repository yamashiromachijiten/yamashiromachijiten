<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コンテンツ管理</title>
    <style>
      a[href="#/media"],
      a[href$="/media"] {
        display: none !important;
      }

      .add-category-link {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1000;
        padding: 10px 16px;
        border-radius: 4px;
        color: #fff;
        background: #3a69c7;
        font: 600 14px/1.4 system-ui, sans-serif;
        text-decoration: none;
        box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
      }

      .add-category-link:hover {
        background: #2f57a6;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      const hideMediaMenu = () => {
        document.querySelectorAll('header a, header button, nav a, nav button').forEach((element) => {
          const text = element.textContent.trim().toLowerCase();
          const href = element.getAttribute('href') || '';

          if (text === 'media' || text === 'メディア' || href === '#/media' || href.endsWith('/media')) {
            const item = element.closest('li') || element;
            item.style.display = 'none';
          }
        });
      };

      const updateAddCategoryLink = () => {
        const existingLink = document.querySelector('.add-category-link');
        const isNewTermPage = window.location.hash === '#/collections/terms/new';

        if (!isNewTermPage) {
          existingLink?.remove();
          return;
        }

        if (!existingLink) {
          const link = document.createElement('a');
          link.className = 'add-category-link';
          link.href = '#/collections/categories/new';
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = 'カテゴリを追加';
          document.body.appendChild(link);
        }
      };

      const updateAdminUi = () => {
        hideMediaMenu();
        updateAddCategoryLink();
      };

      updateAdminUi();
      window.addEventListener('hashchange', updateAdminUi);
      new MutationObserver(updateAdminUi).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
