<!doctype html>
<html lang="{{ .Site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
        color: #222;
        background: #faf8f3;
      }

      body {
        margin: 0;
      }

      a {
        color: #1769aa;
      }

      header,
      main,
      footer {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
      }

      header {
        padding: 32px 0 16px;
        border-bottom: 1px solid #ded8ca;
      }

      nav {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      main {
        padding: 32px 0 48px;
      }

      footer {
        padding: 24px 0 40px;
        border-top: 1px solid #ded8ca;
        color: #666;
        font-size: 0.9rem;
      }

      h1,
      h2 {
        line-height: 1.25;
      }

      .post-list {
        display: grid;
        gap: 20px;
        padding: 0;
        list-style: none;
      }

      .post-card {
        padding: 20px;
        border: 1px solid #ded8ca;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ relURL "/" }}">{{ .Site.Title }}</a>
        <a href="{{ relURL "/posts/" }}">記事一覧</a>
        <a href="{{ relURL "/admin/" }}">CMS</a>
      </nav>
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer>
      <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}</p>
    </footer>
  </body>
</html>
