{{ define "main" }}
  <h1>用語一覧</h1>
  <ul class="item-list">
    {{ range sort .Pages "Params.kana" }}
      <li class="item-card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Params.kana }}<p class="meta">{{ . }}</p>{{ end }}
        {{ with .Summary }}<p>{{ . }}</p>{{ end }}
      </li>
    {{ else }}
      <li>まだ用語がありません。</li>
    {{ end }}
  </ul>
{{ end }}
