{{ define "main" }}
  <h1>カテゴリ</h1>
  <ul class="item-list">
    {{ range .Pages.ByTitle }}
      <li class="item-card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
      </li>
    {{ else }}
      <li>まだカテゴリがありません。</li>
    {{ end }}
  </ul>
{{ end }}
